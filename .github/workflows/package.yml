name: Paczki Linux i Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publikuj aplikację z runtime .NET
        run: dotnet publish StlViewer/StlViewer.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish
      - name: Dołącz licencję i instrukcję
        shell: bash
        run: cp LICENSE README.md README.pl.md publish/
      - name: Pakuj Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp desktop.py publish/desktop.py
          cp uruchom.sh publish/uruchom.sh
          chmod +x publish/uruchom.sh publish/desktop.py
          tar -czf dist/STL-Viewer-linux-x64.tar.gz -C publish .
      - name: Pakuj Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path publish/* -DestinationPath dist/STL-Viewer-win-x64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: STL-Viewer-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
